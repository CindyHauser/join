<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="shortcut icon" href="../assets/logo/logoDark.svg" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/styles-media.css">
    <link rel="stylesheet" href="../styles/loginSignup.css">
</head>

<body class="body-login-signup">
    <header class="header-login-signup content-limit">
        <img src="../assets/logo/logoDark.svg" class="logoDark-SignUp" alt="LogoDark">
    </header>
    <main class="main-login-signup content-limit">
        <div class="login-signup-container">
            <button class="back-arrow" onclick="goBack()">&#8592;</button>
            <div class="h1-login-signup">
                <h1>Sign up</h1>
                <div class="h-line"></div>
            </div>
            <form action="/signup" method="POST" class="login-signup-form" id="signupForm" novalidate>
                <div class="pos-rel">
                    <input type="text" id="name" name="name" class="input-icon bg-input-name"
                        placeholder="Name" autocomplete="name" required data-error="Name is required.">
                </div>
                <div class="pos-rel">
                    <input type="email" id="email" name="email" class="input-icon bg-input-mail"
                        placeholder="Email" autocomplete="email" required data-error="E-Mail is required.">
                </div>
                <div class="pos-rel">
                    <input type="password" id="password" name="password" class="input-icon"
                        placeholder="Password" autocomplete="new-password" required
                        data-error="Password is required.">
                    <img src="../assets/ui-icons/inputLock.svg" alt="" class="password-icon" id="passwordIcon"
                        data-lock="../assets/ui-icons/inputLock.svg"
                        data-invisible="../assets/ui-icons/inputEyeInvisible.svg"
                        data-visible="../assets/ui-icons/inputEyeVisible.svg">
                </div>
                <div class="pos-rel">
                    <input type="password" id="confirmPassword" name="confirm-password"
                        class="input-icon" placeholder="Confirm Password" required
                        data-error="Please confirm your password.">
                    <img src="../assets/ui-icons/inputLock.svg" alt="" class="password-icon" id="confirmPasswordIcon"
                        data-lock="../assets/ui-icons/inputLock.svg"
                        data-invisible="../assets/ui-icons/inputEyeInvisible.svg"
                        data-visible="../assets/ui-icons/inputEyeVisible.svg">
                    <p class="error-message" id="confirmPasswordError"></p>
                </div>
                <div class="pos-rel">
                    <div class="terms-container">
                        <input type="checkbox" class="checkbox" id="terms" name="terms" required
                            data-error="You must accept the Privacy Policy.">
                        <label for="terms" class="terms-label">I agree to the <a
                                href="./privacy-policy-external.html">Privacy Policy</a></label>
                    </div>
                </div>
                <div class="form-btn">
                    <button id="signupButton" type="submit" class="login-signup-btn" disabled>Sign up</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer-login-signup content-limit">
        <nav>
            <a class="privacy-button-box" href="./privacy-policy-external.html">Privacy Policy</a>
            <a class="legal-notice-box" href="./legal-notice-external.html">Legal notice</a>
        </nav>
    </footer>
    <dialog class="dialogLoginAndSignUpDesign" id="successDialog">
        <p>You Signed Up successfully!</p>
    </dialog>
    <p class="rotate-message" role="alert">Please rotate your device back to portrait mode.</p>
</body>
<script src="../js/validateForm.js"></script>
<script src="../js/signup.js"></script>

</html>
